# [secrets] — repo Actions secrets. Each table key is the GitHub secret NAME; the
# value names exactly one source ({ doppler = "KEY" } / { env = "VAR" } /
# { prompt = true }). Seeded with shipit's local-reviewer (codex/agy) GitHub App
# credentials, each sourced from Doppler github/prd. `shipit gh-setup` only pushes
# a secret when its source resolves, so these are safe before the App is installed.
[secrets]
CODEX_REVIEW_APP_PRIVATE_KEY = { doppler = "CODEX_REVIEW_APP_PRIVATE_KEY" }
CODEX_REVIEW_APP_ID          = { doppler = "CODEX_REVIEW_APP_ID" }
AGY_REVIEW_APP_PRIVATE_KEY   = { doppler = "AGY_REVIEW_APP_PRIVATE_KEY" }
AGY_REVIEW_APP_ID            = { doppler = "AGY_REVIEW_APP_ID" }

# [reviewers] — the required-reviewer SET for this repo's PRs (the map KEYS are
# required; ALL must be DONE to flip Ready). Seeded with shipit's shipped default
# (Copilot, review-once), rendered from the single source in
# `prstate.reviewers_config.DEFAULT_REVIEWERS`. codex/agy are NOT seeded by default —
# their review GitHub Apps are not installed on an arbitrary repo, so requiring them
# would park PRs at REVIEWS_PENDING; a repo that HAS the Apps opts them in here (e.g.
# `codex = {}`). Review-once: `rerun` defaults OFF (token-billed; opt in per reviewer
# with e.g. `copilot = { rerun = true }`).
[reviewers]
copilot = {}

# [lint].ignore — paths the managed lint gate must SKIP. Seeded with common
# generated/assembled files (a built CHANGELOG, package lockfiles) that are not
# hand-written prose, so a freshly-onboarded repo does not take a latent gate
# failure on them. Gitignore-style globs. You OWN this list and may extend it —
# it is reconcile-safe: `shipit install` seeds [lint] only when absent and never
# clobbers a table you have edited.
[lint]
ignore = [
  "CHANGELOG.md",
  "CHANGELOG/**",
  "package-lock.json",
  "pnpm-lock.yaml",
]

# [lanes] — the declared PR-time check units (ADP02-WS05, #85). The lane
# planner (`shipit ci plan`) maps these + the CI event + a path-diff to the job
# matrix the wf-checks workflow block runs (`pixi run --locked <run>` per job).
# Modeled on lex-fmt/lex#829 (first-consumer cutover). Lane tasks
# SELF-PROVISION — on a hosted runner nothing outside pixi exists:
#   - `lint-full` (NOT the managed bare `lint` task, which runs in the default
#     env where no lint tool exists on a runner) resolves into the pixi lint
#     env, where the managed toolchain (ruff/shfmt/prettier/markdownlint/
#     actionlint/rust 1.96) lives — see [feature.lint.tasks] in pixi.toml.
#     No lexd provisioning: this repo tracks zero .lex files, so the lex Lang
#     of `shipit lint` never runs.
#   - `test` is the managed pixi task (`./bin/shipit test` → cargo nextest per
#     the rust toolchain; a REAL task, so the #444 POSIX-`test` trap does not
#     apply). No inline provisioning needed — no submodules, no assets — so
#     the lane routes to the managed task directly; its full `cargo nextest`
#     stack (rust, cargo-nextest) and the launcher's uv ride pixi's default
#     env ([dependencies] in pixi.toml).
[lanes.lint]
run = "lint-full"
required = true
local = true

[lanes.test]
run = "test"
required = true
local = true

[toolchains]
"." = "rust"

# [artifacts] — clapfig's declared release surface for the shipit release
# pipeline (ADP02-WS08, arthur-debert/shipit#841; modeled on
# arthur-debert/standout's #187 no-build artifact — the pathfinder shape
# this repo matches almost verbatim). clapfig is a crates-only rust
# workspace: 2 library crates published to crates.io in dependency order
# (clapfig-derive, then clapfig — the lockstep serde/serde_derive
# convention: clapfig's `derive` feature pins clapfig-derive as a
# registry dep, so the derive crate must exist on crates.io first), plus
# a notes-only GitHub release — the legacy surface (release.yml →
# rust-lib.yml@v3) published the same 2 crates and cut a GH release with
# ZERO assets (verified against v0.21.4). The honest declaration is
# therefore a NO-BUILD artifact: no binary, no bundle, no platforms —
# preflight plans an EMPTY matrix (build/sign are plan-proven no-op
# stages that skip) and publish fans over the two endpoints. The crates
# endpoint rides the [toolchains] rust leg above and DERIVES the publish
# order from `cargo metadata` at publish time (topological, alphabetical
# ties; shipit#850 filters `publish = false` members — moot here, both
# workspace members are publishable) — the legacy caller's hand-copied
# `crates: clapfig-derive,clapfig` list is deliberately NOT repeated
# here: topo order gives the same sequence.
[artifacts.clapfig]
endpoints = ["gh-release", "crates"]

