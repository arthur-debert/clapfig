[package]
name = "clapfig"
version = "0.22.1"
edition = "2024"
description = "Rich, layered configuration for Rust CLI apps"
license = "MIT"
repository = "https://github.com/arthur-debert/clapfig"
homepage = "https://github.com/arthur-debert/clapfig"
keywords = ["config", "configuration", "cli", "clap", "toml"]
categories = ["config", "command-line-interface"]
readme = "../../README.md"

[features]
default = ["clap", "derive"]
clap = ["dep:clap"]
url = ["dep:percent-encoding"]
rich-errors = ["dep:miette"]
derive = ["dep:clapfig-derive"]

[dependencies]
clap = { version = "4", features = ["derive", "string"], optional = true }
clapfig-derive = { path = "../clapfig-derive", version = "0.22.1", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: the JSON adapter edits files in place (comments-as-data),
# so document key order must survive an edit round trip; sorted maps would
# tear "//" comment keys away from the fields they document.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
directories = "6"
percent-encoding = { version = "2", optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
trybuild = "1"

[[example]]
name = "clapfig_demo"
path = "examples/clapfig_demo/main.rs"
required-features = ["clap", "derive"]

[[example]]
name = "runtime_schema"
path = "examples/runtime_schema/main.rs"
