[package]
name = "clapfig"
version = "0.22.1"
edition = "2024"
# Declared so the MSRV-aware resolver (workspace resolver = "3") skips
# dependency versions needing a newer toolchain — notably the YAML edit
# stack's tree-sitter-iter, whose latest releases require rustc 1.97.
rust-version = "1.96"
description = "Rich, layered configuration for Rust CLI apps"
license = "MIT"
repository = "https://github.com/arthur-debert/clapfig"
homepage = "https://github.com/arthur-debert/clapfig"
keywords = ["config", "configuration", "cli", "clap", "toml"]
categories = ["config", "command-line-interface"]
readme = "../../README.md"

[features]
default = ["clap", "derive"]
clap = ["dep:clap"]
url = ["dep:percent-encoding"]
rich-errors = ["dep:miette"]
derive = ["dep:clapfig-derive"]

[dependencies]
clap = { version = "4", features = ["derive", "string"], optional = true }
clapfig-derive = { path = "../clapfig-derive", version = "0.22.1", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: the JSON adapter edits files in place (comments-as-data),
# so document key order must survive an edit round trip; sorted maps would
# tear "//" comment keys away from the fields they document.
# arbitrary_precision: keeps each number's lexical form, so the adapter can
# tell an integer literal from a float literal even outside i64/u64 — every
# out-of-range integer literal (positive or negative) is a typed error,
# never a silent float — and untouched numbers survive edits verbatim.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
toml = "0.8"
# The value model's Datetime (ADR-0001): a standalone type crate (not a
# format crate) carrying TOML's four lexical forms. Pinned to the series
# `toml` 0.8 uses so the types stay identical across the boundary.
toml_datetime = { version = "0.6", features = ["serde"] }
toml_edit = "0.22"
directories = "6"
percent-encoding = { version = "2", optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
thiserror = "2"
# The YAML stack (ADR-0003), confined to src/format/yaml.rs: serde_norway
# parses/serializes; yamlpath + yamlpatch do comment-preserving span
# edits; yaml_serde exists only because yamlpatch's patch values are its
# type. yamlpath/yamlpatch are held to the 1.26 series: later releases
# pull tree-sitter-iter builds whose MSRV (1.97) exceeds ours.
serde_norway = "0.9"
# Unconditional (ADR-0009): events are free without a subscriber; a Cargo
# feature would remove the narration exactly when a developer needs it
# (`RUST_LOG=clapfig=trace`). Values never appear in events.
tracing = "0.1"
yamlpath = ">=1.26, <1.28"
yamlpatch = ">=1.26, <1.28"
yaml_serde = "0.10"

[dev-dependencies]
regex = "1"
tempfile = "3"
trybuild = "1"

[[example]]
name = "clapfig_demo"
path = "examples/clapfig_demo/main.rs"
required-features = ["clap", "derive"]

[[example]]
name = "runtime_schema"
path = "examples/runtime_schema/main.rs"
